<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Keep Living - 2D 割草生存</title>
    <meta
      name="description"
      content="Keep Living - 一款 Phaser 3 打造的 2D 割草生存 H5 游戏：多地图关卡、敌人词缀、成就图鉴、神秘商店，PC 与移动端点击即玩。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Keep Living - 2D 割草生存" />
    <meta
      property="og:description"
      content="多地图关卡 / 敌人词缀 / 成就图鉴 / 神秘商店——2D 割草生存 H5 游戏，点击即玩。"
    />
    <meta property="og:url" content="https://wenhjx.github.io/KeepLivingH5/" />
    <!-- og:image 待补：宣传截图就绪后添加 https://wenhjx.github.io/KeepLivingH5/og-cover.png -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23ff6b35' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ff6b35'/%3E%3C/svg%3E"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
      }
      #game-container canvas {
        display: block;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #e0e0e0;
        z-index: 999;
        transition: opacity 0.5s;
      }
      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading .logo {
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 4px;
        margin-bottom: 24px;
        color: #ff6b35;
      }
      #loading .bar {
        width: 200px;
        height: 4px;
        background: #2a2a35;
        border-radius: 2px;
        overflow: hidden;
      }
      #loading .bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff6b35, #ffb347);
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="logo">KEEP LIVING</div>
      <div class="bar"><div class="bar-fill" id="loading-bar"></div></div>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
